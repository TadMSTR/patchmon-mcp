[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchmon-mcp"
version = "0.1.0"
description = "FastMCP Python MCP server wrapping the PatchMon REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
influxdb = ["influxdb3-python>=0.1"]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-grpc>=1.20",
]
nats = ["nats-py>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.20",
]

[project.scripts]
patchmon-mcp = "patchmon_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["patchmon_mcp"]
omit = ["tests/*"]
